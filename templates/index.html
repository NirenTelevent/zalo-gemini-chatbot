<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heart Frame</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e8,#ffeef6);
    overflow:hidden;
    font-family:Arial;
}

/* Tim bay */
body::before{
    content:"💕 💖 💗 💕 💖";
    position:absolute;
    top:-50px;
    width:100%;
    text-align:center;
    font-size:35px;
    animation:fall 12s linear infinite;
    opacity:.7;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

.card{
    position:relative;
    width:420px;
    text-align:center;
}

svg{
    width:100%;
    overflow:visible;
    filter:drop-shadow(0 15px 30px rgba(255,50,120,.35));
}

.photo{
    transition:.4s;
}

.photo:hover{
    transform:scale(1.05);
}

.title{
    margin-top:25px;
    color:#ff4d88;
    font-size:34px;
    font-weight:bold;
}

.sub{
    color:#777;
    margin-top:8px;
}
</style>

</head>
<body>

<div class="card">

<svg viewBox="0 0 512 512">

<defs>

<clipPath id="heartClip">

<path d="
M256 470
C180 410 40 310 40 170
C40 95 95 40 170 40
C214 40 244 61 256 90
C268 61 298 40 342 40
C417 40 472 95 472 170
C472 310 332 410 256 470Z"/>

</clipPath>

</defs>

<!-- Viền -->

<path
d="
M256 470
C180 410 40 310 40 170
C40 95 95 40 170 40
C214 40 244 61 256 90
C268 61 298 40 342 40
C417 40 472 95 472 170
C472 310 332 410 256 470Z"
fill="#fff"
stroke="#ff4d88"
stroke-width="14"/>

<!-- Ảnh -->

<image
class="photo"
href="https://prnt.sc/RrisV1ERNiKS"
width="512"
height="512"
clip-path="url(#heartClip)"
preserveAspectRatio="xMidYMid slice"/>

</svg>

<div class="title">❤️ My Love ❤️</div>
<div class="sub">Forever & Always</div>

</div>

</body>
</html>
