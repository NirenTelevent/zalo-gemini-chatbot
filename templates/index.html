<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Photo Frame</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    overflow:hidden;
    font-family:sans-serif;
}

/* Trái tim */
.heart{
    position:relative;
    width:320px;
    height:320px;
    transform:rotate(-45deg);
    animation:beat 1.8s infinite;
    filter:drop-shadow(0 15px 30px rgba(255,0,100,.4));
}

.heart::before,
.heart::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    background:#ff4d88;
    border-radius:50%;
}

.heart::before{
    top:-160px;
    left:0;
}

.heart::after{
    left:160px;
    top:0;
}

/* Ảnh */
.photo{
    position:absolute;
    inset:20px;
    overflow:hidden;
    z-index:2;
    clip-path:path("M160 300 C40 220 0 140 0 80 C0 30 40 0 80 0 C120 0 150 30 160 50 C170 30 200 0 240 0 C280 0 320 30 320 80 C320 140 280 220 160 300");
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:rotate(45deg) scale(1.15);
}

/* Viền */
.border{
    position:absolute;
    inset:-8px;
    border:8px solid #fff;
    border-radius:20px;
    transform:rotate(45deg);
    pointer-events:none;
}

/* Chữ */
.text{
    position:absolute;
    bottom:-90px;
    width:100%;
    text-align:center;
    transform:rotate(45deg);
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:0 3px 10px rgba(0,0,0,.3);
}

/* Tim bay */
span{
    position:absolute;
    color:#fff;
    font-size:20px;
    animation:float 6s linear infinite;
    opacity:.8;
}

span:nth-child(1){left:10%;animation-delay:0s;}
span:nth-child(2){left:30%;animation-delay:1s;}
span:nth-child(3){left:50%;animation-delay:2s;}
span:nth-child(4){left:70%;animation-delay:3s;}
span:nth-child(5){left:90%;animation-delay:4s;}

@keyframes beat{
    0%,100%{
        transform:rotate(-45deg) scale(1);
    }
    50%{
        transform:rotate(-45deg) scale(1.06);
    }
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-150px);
        opacity:0;
    }
}
</style>

</head>
<body>

<span>❤</span>
<span>💕</span>
<span>💖</span>
<span>💗</span>
<span>❤</span>

<div class="heart">

    <div class="photo">
        <img src="your-photo.jpg" alt="Người yêu">
    </div>

    <div class="text">
        ❤️ My Love ❤️
    </div>

</div>

</body>
</html>
